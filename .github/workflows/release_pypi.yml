name: PyPI release

on:
  release:
    types: [released]

jobs:
  build_and_upload:

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/esp-coredump

    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools
    - name: Build esp-coredump ${{ github.event.release.tag_name }}
      run: |
        echo "Packaging esp-coredump version: $(python setup.py --version)"
        python -m build
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
